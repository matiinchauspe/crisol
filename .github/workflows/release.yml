name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # setup-bun only warns when it cannot read the file, then installs the latest Bun.
      - name: Check the Bun version matches .bun-version
        run: test "$(bun --version)" = "$(tr -d '[:space:]' < .bun-version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          declared="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${declared}." >&2
            exit 1
          fi

      # No `bun test` here: the suite drives a real Docker engine, which hosted macOS runners lack.
      # It runs on the release commit before the tag is pushed.
      - name: Typecheck
        run: bun run typecheck

      - name: Compile
        run: bun run build:release

      - name: Smoke-test the arm64 binary
        run: test "$(dist/crisol-darwin-arm64 --version)" = "${GITHUB_REF_NAME#v}"

      # The runner is Apple silicon; its image installs Rosetta 2, which runs the x64 binary.
      - name: Smoke-test the x64 binary under Rosetta
        run: test "$(arch -x86_64 dist/crisol-darwin-x64 --version)" = "${GITHUB_REF_NAME#v}"

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 crisol-darwin-arm64 crisol-darwin-x64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/crisol-darwin-arm64
            dist/crisol-darwin-x64
            dist/checksums.txt
          generate_release_notes: true

  # The tagged commit predates its own checksums, and main takes changes only through a pull
  # request, so the filled formula reaches main as a PR the owner merges. A job of its own, filled
  # from the published checksums.txt, so re-running it never rebuilds or re-uploads a binary.
  formula:
    name: Open the formula pull request
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Open the pull request that fills the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/formula-${GITHUB_REF_NAME}"
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir "$RUNNER_TEMP"
          bun scripts/formula.ts fill Formula/crisol.rb "${GITHUB_REF_NAME#v}" "${RUNNER_TEMP}/checksums.txt"
          bun scripts/formula.ts check Formula/crisol.rb
          if git diff --quiet -- Formula/crisol.rb; then
            echo "Formula/crisol.rb on main already holds ${GITHUB_REF_NAME}'s values; no pull request needed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): fill the formula for ${GITHUB_REF_NAME}" -- Formula/crisol.rb
          git push --force origin "HEAD:refs/heads/${branch}"
          pr="$(gh pr list --head "$branch" --state open --json url,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not))[0].url // empty')"
          if [ -z "$pr" ]; then
            if ! pr="$(gh pr create --base main --head "$branch" \
              --title "chore(release): fill the formula for ${GITHUB_REF_NAME}" \
              --body "Fills \`Formula/crisol.rb\` with ${GITHUB_REF_NAME}'s version and the sha256 values from its \`checksums.txt\`. \`brew install\` picks up ${GITHUB_REF_NAME} only once this is merged.")"; then
              echo "Opening the pull request failed; branch ${branch} holds the filled formula. If the repo setting \"Allow GitHub Actions to create and approve pull requests\" is off, turn it on and re-run this job." >&2
              exit 1
            fi
          fi
          echo "Merge ${pr} so \`brew install\` picks up ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
